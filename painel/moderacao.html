<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; -webkit-text-size-adjust: 100%; }
</style>
<title>Fila de Moderação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  /* Layout: mesma identidade do Placar de Custos — faixa rubro-negra, cartões empilhados.
     Cada cartão é UM caso (um alvo), não uma denúncia: a decisão fecha todas de uma vez. */
  :root {
    --fundo:        #f7f6f4;
    --superficie:   #ffffff;
    --borda:        #e2dfda;
    --texto:        #16150f;
    --texto-2:      #5c5950;
    --texto-3:      #8a867c;
    --marca:        #c8102e;
    --bom:          #0ca30c;
    --atencao:      #fab219;
    --critico:      #d03b3b;

    --display: 'Oswald', 'Arial Narrow', sans-serif;
    --corpo:   'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --dado:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo:      #0e0e10;
      --superficie: #17171a;
      --borda:      #2a2a2f;
      --texto:      #f4f3f0;
      --texto-2:    #a9a69d;
      --texto-3:    #78756d;
      --marca:      #e8324c;
      --bom:        #4fc98a;
      --atencao:    #e0a64a;
      --critico:    #f0707c;
      color-scheme: dark;
    }
  }

  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: var(--corpo);
    font-size: 15px;
    line-height: 1.5;
  }
  .envelope { max-width: 860px; margin: 0 auto; padding-inline: 18px; padding-block: 0 48px; }

  .faixa { background: var(--marca); color: #fff; padding-block: 20px 16px; }
  .faixa .envelope { padding-block: 0; }
  h1 {
    font-family: var(--display); font-weight: 600; text-transform: uppercase;
    font-size: clamp(24px, 5vw, 34px); letter-spacing: .02em; margin: 0 0 4px; line-height: 1.1;
  }
  .faixa p { margin: 0; font-size: 14px; opacity: .9; }

  .barra {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-block: 18px 16px;
  }
  .contador {
    font-family: var(--display); text-transform: uppercase; letter-spacing: .06em;
    font-size: 13px; color: var(--texto-2);
  }
  button {
    font-family: var(--corpo); font-size: 14px; font-weight: 500;
    border: 1px solid var(--borda); background: var(--superficie); color: var(--texto);
    padding: 7px 13px; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--texto-3); }
  button:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  button.perigo { background: var(--marca); border-color: var(--marca); color: #fff; }
  button.perigo:hover { filter: brightness(1.1); }
  button[disabled] { opacity: .5; cursor: not-allowed; }

  .caso {
    background: var(--superficie); border: 1px solid var(--borda);
    border-left: 4px solid var(--atencao); border-radius: 3px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .caso.quente { border-left-color: var(--critico); }
  .caso .topo { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; }
  .tipo {
    font-family: var(--display); text-transform: uppercase; letter-spacing: .07em;
    font-size: 12px; background: var(--fundo); border: 1px solid var(--borda);
    padding: 2px 7px; border-radius: 2px; color: var(--texto-2);
  }
  .peso { font-family: var(--display); font-size: 20px; color: var(--critico); }
  .autor { font-weight: 600; }
  .banido { color: var(--critico); font-size: 13px; }
  .previa {
    font-family: var(--dado); font-size: 13px; color: var(--texto-2);
    background: var(--fundo); border: 1px solid var(--borda); border-radius: 3px;
    padding: 8px 10px; margin: 10px 0; word-break: break-word; white-space: pre-wrap;
  }
  .motivos { font-size: 13px; color: var(--texto-2); margin: 6px 0 0; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .id { font-family: var(--dado); font-size: 11.5px; color: var(--texto-3); word-break: break-all; }

  .aviso {
    border: 1px solid var(--borda); border-left: 4px solid var(--marca);
    background: var(--superficie); padding: 12px 16px; border-radius: 0 3px 3px 0;
    font-size: 14px; margin-bottom: 16px;
  }
  .vazio { text-align: center; color: var(--texto-2); padding: 48px 16px; }
  .vazio strong { display: block; font-family: var(--display); font-size: 22px; text-transform: uppercase; color: var(--bom); margin-bottom: 6px; }
  label { display: block; font-size: 13px; color: var(--texto-2); margin-bottom: 4px; }
  input[type="password"], input[type="text"] {
    font-family: var(--corpo); font-size: 15px; width: 100%;
    padding: 9px 11px; border: 1px solid var(--borda); border-radius: 3px;
    background: var(--superficie); color: var(--texto);
  }
  .entrada { max-width: 420px; margin-top: 28px; }
  .erro { color: var(--critico); font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>

<div class="faixa">
  <div class="envelope">
    <h1>Fila de Moderação</h1>
    <p>Denúncias pendentes, agrupadas por alvo. Uma decisão fecha todas as do mesmo caso.</p>
  </div>
</div>

<div class="envelope">
  <div id="entrada" class="entrada" hidden>
    <div class="aviso">
      Cole o <strong>PAINEL_TOKEN</strong> do projeto. Fica guardado neste navegador.
    </div>
    <label for="token">Token do painel</label>
    <input type="password" id="token" autocomplete="off" spellcheck="false">
    <p><button id="entrar" class="perigo">Abrir a fila</button></p>
    <p id="erro-entrada" class="erro" hidden></p>
  </div>

  <div id="conteudo" hidden>
    <div class="barra">
      <span class="contador" id="contador">carregando…</span>
      <button id="recarregar">Recarregar</button>
      <button id="trocar-token">Trocar token</button>
    </div>
    <div id="lista"></div>
  </div>
</div>

<script>
(function () {
  var CHAVE = 'vulture.painel.token';
  var BASE = (localStorage.getItem('vulture.painel.url') || '').replace(/\/$/, '');

  var el = function (id) { return document.getElementById(id); };
  var token = '';

  function lerToken() {
    try { return localStorage.getItem(CHAVE) || ''; } catch (e) { return ''; }
  }
  function gravarToken(t) {
    try { localStorage.setItem(CHAVE, t); } catch (e) { /* navegação privada */ }
  }

  function urlDaFuncao() {
    if (BASE) return BASE + '/functions/v1/moderacao';
    // mesma origem do painel de custos quando ele já foi configurado
    var salva = '';
    try { salva = localStorage.getItem('vulture.supabase.url') || ''; } catch (e) { /* idem */ }
    return (salva.replace(/\/$/, '') || 'https://mlajeudfsjymgaxjofya.supabase.co') +
      '/functions/v1/moderacao';
  }

  function pedir(opcoes) {
    return fetch(urlDaFuncao(), Object.assign({
      headers: { 'x-painel-token': token, 'Content-Type': 'application/json' }
    }, opcoes || {})).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function escapar(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function rotuloDoTipo(t) {
    return { video: 'Vídeo', comentario: 'Comentário', live: 'Live', usuario: 'Perfil' }[t] || t;
  }

  function desenhar(dados) {
    var lista = el('lista');
    var fila = dados.fila || [];
    el('contador').textContent = fila.length === 0
      ? 'nada pendente · ' + dados.decididosNaSemana + ' decididos na semana'
      : fila.length + (fila.length === 1 ? ' caso aberto' : ' casos abertos') +
        ' · ' + dados.decididosNaSemana + ' decididos na semana';

    if (fila.length === 0) {
      lista.innerHTML = '<div class="vazio"><strong>Fila limpa</strong>' +
        'Nenhuma denúncia esperando decisão.</div>';
      return;
    }

    lista.innerHTML = fila.map(function (c, i) {
      var quente = c.denuncias >= 3;
      return '<div class="caso' + (quente ? ' quente' : '') + '" data-i="' + i + '">' +
        '<div class="topo">' +
          '<span><span class="tipo">' + rotuloDoTipo(c.tipo_alvo) + '</span> ' +
          '<span class="autor">@' + escapar(c.autor || 'desconhecido') + '</span>' +
          (c.autor_banido ? ' <span class="banido">· já banido</span>' : '') + '</span>' +
          '<span class="peso">' + c.denuncias + '×</span>' +
        '</div>' +
        (c.previa ? '<div class="previa">' + escapar(c.previa).slice(0, 400) + '</div>' : '') +
        '<p class="motivos">Motivos: ' + escapar((c.motivos || []).join(', ')) + '</p>' +
        '<p class="id">' + escapar(c.alvo_id) + '</p>' +
        '<div class="acoes">' +
          '<button data-acao="remover" class="perigo">Remover conteúdo</button>' +
          '<button data-acao="suspender">Suspender 7 dias</button>' +
          '<button data-acao="banir">Banir</button>' +
          '<button data-acao="descartar">Descartar denúncia</button>' +
        '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(lista.querySelectorAll('.caso'), function (no) {
      var caso = fila[+no.getAttribute('data-i')];
      Array.prototype.forEach.call(no.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          decidir(caso, b.getAttribute('data-acao'), no);
        });
      });
    });
  }

  function decidir(caso, acao, no) {
    Array.prototype.forEach.call(no.querySelectorAll('button'), function (b) { b.disabled = true; });
    pedir({
      method: 'POST',
      body: JSON.stringify({
        tipoAlvo: caso.tipo_alvo,
        alvoId: caso.alvo_id,
        acao: acao,
        motivo: 'painel',
        dias: acao === 'suspender' ? 7 : null
      })
    }).then(carregar).catch(function (e) {
      no.insertAdjacentHTML('beforeend', '<p class="erro">' + escapar(e.message) + '</p>');
      Array.prototype.forEach.call(no.querySelectorAll('button'), function (b) { b.disabled = false; });
    });
  }

  function carregar() {
    el('contador').textContent = 'carregando…';
    return pedir().then(desenhar).catch(function (e) {
      el('lista').innerHTML = '<p class="erro">' + escapar(e.message) + '</p>';
      el('contador').textContent = 'erro';
    });
  }

  function abrir() {
    el('entrada').hidden = true;
    el('conteudo').hidden = false;
    carregar();
  }

  el('entrar').addEventListener('click', function () {
    var t = el('token').value.trim();
    if (!t) return;
    token = t;
    pedir().then(function (d) {
      gravarToken(t);
      abrir();
      desenhar(d);
    }).catch(function (e) {
      el('erro-entrada').textContent = e.message;
      el('erro-entrada').hidden = false;
    });
  });

  el('recarregar').addEventListener('click', carregar);
  el('trocar-token').addEventListener('click', function () {
    gravarToken('');
    token = '';
    el('conteudo').hidden = true;
    el('entrada').hidden = false;
    el('token').value = '';
  });

  token = lerToken();
  if (token) abrir(); else el('entrada').hidden = false;
})();
</script>
</body>
</html>
